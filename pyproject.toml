[project]
name = "testbed"
version = "0.1.0"
description = "Prompt injection testbed for LLM-integrated applications (Master's dissertation)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
    "fastembed>=0.9.1",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testbed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
# E/W/F: errors and style; I: import order; S: security checks (the flake8-bandit rules); B: likely bugs
select = ["E", "W", "F", "I", "S", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S108"]  # asserts, running our own hook script, fake paths as test data
".claude/hooks/audit_log.py" = ["S110"]  # the audit hook must never break a session; not ours to change
"src/testbed/evaluation/run.py" = ["S607"]  # `git` is resolved from PATH on purpose (cross-platform)
