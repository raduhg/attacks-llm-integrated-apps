[project]
name = "testbed"
version = "0.1.0"
description = "Prompt injection testbed for LLM-integrated applications (Master's dissertation)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
    "fastembed>=0.9.1",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testbed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
